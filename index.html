<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TEST Trusses">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffc400">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="icon" sizes="192x192" href="icon-192.png">
<title>TEST · Floor Trusses · AMLI West</title>
<style>
:root{--nf:#ffc400;--nf2:#d99a00;--nfd:#5a4300;--ink:#1b1b1b;--soft:#fff4c2;--bg:#f6f4ee;--card:#ffffff;--line:#d9dee5;--txt:#1b2430;--muted:#5b6675;--ok:#1f8a4c;--warn:#c9850a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.35;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.hdr{position:sticky;top:0;z-index:20;background:var(--nf);color:var(--ink);padding:env(safe-area-inset-top,0) 0 0 0;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hdr .row{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:56px}
.hdr .logo{flex:0 0 auto;height:38px;width:38px;display:block}
.hdr .back{flex:0 0 auto;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.12);border-radius:10px;padding:10px 12px;font-weight:600;min-height:44px}
.hdr .ttl{flex:1 1 auto;min-width:0}
.hdr .updbar{display:flex;justify-content:flex-end;padding:4px 12px 0}
.hdr .updbar{align-items:center;justify-content:space-between;gap:8px;padding:5px 12px 0}
.hdr .modesw{display:flex;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden;flex:0 1 auto}
.hdr .modesw button{color:var(--ink);font-weight:700;font-size:12.5px;line-height:1;padding:0 11px;min-height:34px;background:transparent;white-space:nowrap}
.hdr .modesw button+button{border-left:1.5px solid var(--ink)}
.hdr .modesw button.on{background:var(--ink);color:#fff}
.hdr .upd{border:1.5px solid var(--ink);border-radius:6px;padding:1px 8px;font-size:11px;line-height:1.35;font-weight:700;letter-spacing:.3px;white-space:nowrap;background:rgba(0,0,0,.07)}
.hdr .upd i{font-style:normal;font-weight:400;margin-left:4px}
.hdr .ttl .t1{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl .t2{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .stripe{height:5px;width:100%}
.wrap{padding:12px 12px 90px 12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px 0}
.card h2{font-size:15px;margin:0 0 8px 0;color:var(--nfd);text-transform:uppercase;letter-spacing:.03em}
.card h2 small{display:block;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);font-size:12.5px}
.title-card{background:var(--nf);color:var(--ink);border:0}
.title-card .big{font-size:20px;font-weight:800;line-height:1.2}
.title-card .sub{font-size:13.5px;opacity:.92;margin-top:6px}
.title-card .meta{font-size:12px;opacity:.8;margin-top:8px}
.plan{position:relative;width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.plan img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.plan .lbl{position:absolute;transform:translate(-50%,-50%);background:rgba(255,255,255,.93);border:2px solid #333;border-radius:999px;padding:5px 10px;font-weight:800;font-size:13px;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.3);white-space:nowrap}
.hint{font-size:12.5px;color:var(--muted);margin:8px 2px 0 2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbtn{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:64px;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.sbtn:active{background:var(--soft)}
.sbtn .sw{flex:0 0 auto;width:18px;height:40px;border-radius:5px}
.sbtn .n{font-weight:800;font-size:17px}
.sbtn .b{font-size:12px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--nf);color:var(--ink);border:2px solid var(--nf2);border-radius:12px;padding:13px 14px;font-weight:700;min-height:48px;width:100%;text-align:center}
.btn.sec{background:#fff;color:var(--nfd);border:2px solid var(--nf2)}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px;width:auto}
.btn:active{filter:brightness(.92)}
.viewer{position:relative;width:100%;height:58vh;min-height:300px;background:#dfe3e8;border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none;user-select:none}
.viewer.tall{height:88vh !important}
.viewer img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none;max-width:none}
.viewer .tapwrap{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;pointer-events:none}
.viewer .tapwrap .tap{position:absolute;pointer-events:auto;background:rgba(255,220,0,0);border:0;border-radius:6px;padding:0}
.viewer .tapwrap .tap:active{background:rgba(255,196,0,.35)}
.viewer.full{position:fixed;left:0;top:0;right:0;bottom:0;width:100vw;height:100vh;height:100dvh;min-height:0;z-index:60;border-radius:0;border:0}
.viewer.full .ctl{bottom:calc(8px + env(safe-area-inset-bottom,0px));right:calc(8px + env(safe-area-inset-right,0px))}
.viewer .xfull{display:none;position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));z-index:6;min-height:44px;padding:0 14px;border-radius:10px;background:var(--nf);color:var(--ink);border:2px solid var(--ink);font-weight:800;font-size:14px;align-items:center;gap:6px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.viewer.full .xfull{display:flex}
body.nf-lock{overflow:hidden}
body.nf-lock #nfhint{display:none !important}
.viewer .ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:5}
.viewer .ctl button{width:44px;height:44px;border-radius:10px;background:var(--nf);color:var(--ink);border:2px solid var(--ink);font-size:20px;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.viewer .ctl button.wide{width:auto;padding:0 12px;font-size:13px}
.viewer .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#444;font-weight:600;background:#e9ecf0}
.tabs{display:flex;gap:6px;margin:0 0 8px 0;flex-wrap:wrap}
.tab{flex:1 1 auto;min-height:40px;border-radius:10px;border:2px solid var(--nf2);color:var(--nfd);font-weight:700;padding:6px 10px;background:#fff}
.tab.on{background:var(--nf);color:var(--ink)}
.srch{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;margin:0 0 10px 0}
.conn{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.conn .chip{flex:0 0 auto;width:14px;border-radius:5px;border:1px solid rgba(0,0,0,.25)}
.conn .body{flex:1 1 auto;min-width:0}
.conn .id{font-weight:800;font-size:17px}
.conn .id .v{font-weight:600;font-size:13px;color:var(--warn);margin-left:6px}
.conn .nm{font-size:13.5px;color:var(--txt);margin-top:2px}
.conn .nm .es{color:var(--muted)}
.conn .ref{font-size:12px;color:var(--muted);margin-top:2px}
.conn .cnt{font-size:12.5px;color:var(--muted);margin-top:4px}
.conn .secs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:600;background:#f7f8fa;color:#223;min-height:28px}
.pill.on{background:var(--nf);color:var(--ink);border-color:var(--nf2)}
.pill .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.conn .go{margin-top:8px}
.detail-head{display:flex;gap:10px;align-items:flex-start}
.detail-head .chip{flex:0 0 auto;width:16px;min-height:52px;border-radius:5px;border:1px solid rgba(0,0,0,.25)}
.detail-head .id{font-weight:800;font-size:20px}
.detail-head .id .v{font-weight:600;font-size:14px;color:var(--warn);margin-left:6px}
.detail-head .nm{font-size:14px;margin-top:2px}
.detail-head .nm .es{color:var(--muted)}
.detail-head .ref{font-size:12.5px;color:var(--muted);margin-top:2px}
.nav2{display:flex;gap:10px;margin-top:4px}
.nav2 .btn{flex:1 1 0}
.fam{font-size:13px;font-weight:800;color:var(--nfd);margin:14px 2px 6px 2px;text-transform:uppercase;letter-spacing:.03em}
.fam:first-child{margin-top:0}
.row2{display:flex;gap:10px;align-items:center}
details.notes summary{font-weight:700;color:var(--nfd);cursor:pointer;min-height:40px;display:flex;align-items:center}
details.notes ol{padding-left:20px;margin:6px 0 0 0}
details.notes li{margin:0 0 8px 0;font-size:13.5px}
details.notes li .es{display:block;color:var(--muted);font-size:12.5px}
.foot{font-size:11.5px;color:var(--muted);text-align:center;margin:12px 0 0 0}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0)) 8px;gap:6px}
.bottombar button{flex:1 1 0;min-height:48px;border-radius:10px;font-weight:700;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.bottombar button.on{background:var(--nf)}
.bottombar button span{font-size:11px;font-weight:500;color:#4a4a4a}
.empty{color:var(--muted);font-size:14px;padding:8px 2px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}

.inst .btn{font-size:18px;min-height:56px;letter-spacing:.02em}
.inst .btn small{display:block;font-weight:500;font-size:12.5px;opacity:.95}
.inst .guide{display:none;margin-top:10px;border:1.5px solid var(--nf2);border-radius:12px;background:var(--soft);padding:10px 12px}
.inst .guide.on{display:block}
.inst .guide ol{margin:0;padding-left:22px}
.inst .guide li{margin:0 0 8px 0;font-weight:600;color:var(--txt)}
.inst .guide li span{display:block;font-weight:400;color:var(--muted);font-size:13px}
.inst .guide .btn.small{margin-top:4px}
.inst .done{display:none;font-weight:700;color:var(--ok)}
.inst{border:3px solid var(--nf2);border-radius:14px}
.inst .ibtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--nf);color:var(--ink);border:0;border-radius:14px;padding:16px 12px;font-size:19px;font-weight:800;min-height:58px;cursor:pointer}
.inst .ibtn small{display:block;font-size:13px;font-weight:700}
.inst .ibtn:active{filter:brightness(.92)}
.inst .sv{font-size:13px;color:var(--muted);text-align:center;margin:8px 2px 0 2px}
.hbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:var(--ink);border:3px solid var(--nf2);border-radius:14px;padding:13px 12px;font-size:17px;font-weight:800;min-height:54px;cursor:pointer;margin:0 0 12px 0}
.hbtn small{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.hbtn:active{filter:brightness(.95)}
.ins .warn{background:#fff0f0;border:3px solid #c0392b;border-radius:14px;padding:12px;margin:0 0 12px 0}
.ins .warn .big{display:block;font-size:18px;font-weight:800;color:#9b1c1c;line-height:1.15;margin-bottom:6px}
.ins .warn p{margin:0 0 6px 0;color:var(--ink)}
.ins .tabs{display:flex;gap:8px;margin:0 0 12px 0}
.ins .tabs button{flex:1;min-height:48px;border:2px solid var(--nf2);border-radius:12px;background:#fff;font-weight:800;font-size:16px;color:var(--ink)}
.ins .tabs button.on{background:var(--nf)}
.ins .dev{display:none}.ins .dev.on{display:block}
.ins .mock{background:#f2f2f7;border:1px solid #c7c7cc;border-radius:12px;padding:10px;margin-top:8px;color:#222}
.ins .mbar{display:flex;justify-content:space-around;align-items:center;background:#fff;border-radius:10px;padding:8px 2px;font-size:20px;color:#0a7aff}
.ins .mbar span{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;border-radius:10px}
.ins .mrow{background:#fff;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;margin:4px 0;font-size:15px;color:#222}
.ins .mrow svg{flex:0 0 auto}
.ins .mhead{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:2px 4px 8px 4px;color:#0a7aff}
.ins .mhead b{color:#111}
.ins .hl{outline:4px solid #e11d1d;outline-offset:1px;position:relative}
.ins .tap{display:inline-block;background:#e11d1d;color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;margin-left:6px;white-space:nowrap}
.ins .icoapp{width:64px;height:64px;border-radius:15px;background:var(--nf);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;line-height:1.05;text-align:center;color:var(--ink)}
.ins .note{font-size:13.5px;color:var(--muted);margin-top:6px}
.inb{display:flex;gap:10px;align-items:center;width:100%;background:#fff0f0;border:3px solid #c0392b;border-radius:14px;padding:11px 12px;margin:0 0 12px 0;font-size:16px;font-weight:800;color:#9b1c1c;text-align:left;cursor:pointer}
.inb small{display:block;font-size:12.5px;font-weight:600;color:var(--ink)}
.how .st{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px 0}
.how .st .hd{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.how .st .num{flex:0 0 38px;height:38px;border-radius:50%;background:var(--nf);color:var(--ink);border:2px solid var(--ink);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.how .st .t{font-weight:800;font-size:17px;color:var(--ink);line-height:1.15}
.how .st .t small{display:block;font-weight:600;font-size:13px;color:var(--muted)}
.how .st p{margin:6px 0;font-size:14.5px;line-height:1.4;color:var(--txt)}
.how .st p i{color:var(--muted)}
.how .st img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin-top:8px}
.how .air{background:var(--soft);border:2px dashed var(--nf2);border-radius:12px;padding:12px;text-align:center;font-weight:800;color:var(--ink);font-size:16px;margin-top:8px}
.how .air span{display:block;font-size:34px;line-height:1.1}
.how .air small{display:block;font-weight:600;font-size:13px;color:var(--muted)}

/* UPDATE 7 TEST: Trusses */
.hdr .updbar{flex-wrap:wrap}
.hdr .modesw button{padding:0 9px}
.trtest{background:#c0392b;color:#fff;font-weight:800;font-size:13px;text-align:center;padding:7px 10px;line-height:1.25}
.viewer .tapwrap .tap.tr{background:rgba(255,196,0,.28);border:4px solid rgba(217,154,0,.95);border-radius:6px}
.viewer .tapwrap .tap.tr:active{background:rgba(255,196,0,.6)}
.viewer .tapwrap .tap.tr.hl{background:rgba(225,29,29,.28);border-color:#e11d1d}
.sbtn[disabled]{cursor:default}

/* UPDATE 7 TEST v3: level buttons on Home */
.lvls{display:flex;flex-direction:column;gap:10px}
.lvlbtn{display:flex;align-items:center;gap:14px;width:100%;min-height:78px;border-radius:14px;border:2px solid var(--nf2);background:var(--nf);color:var(--ink);padding:10px 14px;text-align:left}
.lvlbtn .ln{font-size:44px;font-weight:900;line-height:1;min-width:70px;text-align:center}
.lvlbtn .ln small{display:block;font-size:10px;font-weight:800;letter-spacing:.04em;margin-bottom:2px}
.lvlbtn .lt{flex:1;font-size:15px;font-weight:700;line-height:1.3}
.lvlbtn .lc{font-size:32px;font-weight:900}
.lvlbtn.off{background:#fff;color:#4b5563;border-color:var(--line)}
.sbtn[disabled]{opacity:.9!important}
.sbtn[disabled] .n{color:#374151}

/* UPDATE 7 TEST v6: element numbers */
[data-n]{position:relative}
[data-n]::before{content:attr(data-n);position:absolute;top:-9px;left:-6px;z-index:50;min-width:22px;height:22px;padding:0 5px;box-sizing:border-box;border-radius:11px;background:#111827;color:#fff;border:2px solid #fff;font:800 12px/18px system-ui,Arial,sans-serif;text-align:center;pointer-events:none}
#nfstbox[data-n]::before{top:-18px;left:auto;right:-13px}
.trtest[data-n]{padding-left:34px;padding-right:34px}
[data-n="1"]::before{top:6px;left:6px}
[data-n="2"]::before{top:-17px;left:2px}
[data-n="3"]::before{top:-6px;left:-26px}
[data-n="16"]::before{top:-22px;left:0}
/* UPDATE 7 TEST v4: Home from Jorge's sketch */
.fgrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(92px,auto);gap:10px;margin:0 0 12px 0}
.btn.more{background:var(--nf);color:var(--ink);font-size:17px;font-weight:900;min-height:58px;line-height:1.2}
.fbtn{display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;border-radius:14px;border:2px solid var(--nf2);background:var(--nf);color:var(--ink);padding:10px 12px;min-height:92px}
.fbtn b{font-size:21px;font-weight:900;line-height:1.1}
.fbtn span{font-size:13px;font-weight:700}
.fbtn small{font-size:12px;font-weight:600;line-height:1.25;margin-top:2px}
.fbtn.off{background:#fff;color:#374151;border-color:var(--line);opacity:1}
.fbtn.off b{font-size:16px}
.fbtn[disabled]{opacity:1}
.nfstat{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px 0;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:#111827;text-align:left;font-size:13px;font-weight:700;line-height:1.3}
.nfstat.g{border-color:#15803d}.nfstat.y{border-color:#a16207}.nfstat.r{border-color:#b91c1c}
.stbox{display:inline-block;flex:0 0 auto;width:20px;height:20px;border-radius:5px;border:2px solid #111827;vertical-align:middle;background:#d1d5db}
.stbox.g{background:#16a34a}.stbox.y{background:#facc15}.stbox.r{background:#dc2626}.stbox.c,.stbox.n{background:#d1d5db}
.hdr .upd .stbox{width:14px;height:14px;margin-left:6px;border-width:1.5px;border-radius:4px;position:relative;top:-1px}

/* UPDATE 7 TEST v7: Home changes by number (Jorge Nov 10, 2026) */
.hdr.homehdr{display:flex;flex-direction:column}
.hdr.homehdr .row{order:1;padding:12px 12px 4px 12px;gap:12px}
.hdr.homehdr .logo{height:76px;width:76px}
.hdr.homehdr .ttl .t1{font-size:28px;line-height:1.1}
.hdr.homehdr .ttl .t2{font-size:12.5px;white-space:normal;line-height:1.25}
.hdr.homehdr .updbar{order:2;justify-content:flex-start;padding:2px 14px 8px 14px}
.hdr.homehdr .upd{border:0;background:none;padding:0;font-size:13px;color:var(--ink)}
.hdr.homehdr .stripe{order:3}
.hdr.homehdr .p2back{order:0;padding:8px 12px 0 12px}
.hdr.homehdr .p2back .back{font-size:18px}
.nfstat{width:38px;height:38px;padding:0;margin:0 0 12px 0;border:2px solid #111827;border-radius:8px;background:#dc2626;display:block}
.nfstat.g{background:#16a34a;border-color:#111827}.nfstat.y,.nfstat.r,.nfstat.c,.nfstat.n{background:#dc2626;border-color:#111827}
[data-n="3"]::before{top:-6px;left:auto;right:-28px}
[data-n="2"]::before{top:-12px;left:2px}

/* UPDATE 7 TEST v8: #3 + #5 merged into one status bar (green = updated, red = not updated) */
.hdr.homehdr .row{padding:12px 12px 12px 12px}

function sortKey(id){ return String(id).match(/\d+|\D+/g) || [String(id)]; }
function cmpId(a,b){ const pa=sortKey(a), pb=sortKey(b), len=Math.max(pa.length,pb.length);
  for(let i=0;i<len;i++){ const ta=pa[i], tb=pb[i];

function makeViewer(el, srcKey, opts){
  opts=opts||{};
  el.innerHTML='<div class="loading">Loading… / Cargando…</div>';
  const img=document.createElement('img'); img.draggable=false;
  const ov=document.createElement('div'); ov.className='tapwrap';
  const ctl=document.createElement('div'); ctl.className='ctl';
  ctl.innerHTML='<button class="wide" data-a="fit" title="Fit">FIT</button><button data-a="minus">−</button><button data-a="plus">+</button><button class="wide" data-a="tall">⤢</button>';
  let scale=1,minS=1,tx=0,ty=0,iw=0,ih=0,cw=0,ch=0;
  const CTRL_RESERVE=opts.noctl?0:60; /* px reserved at the bottom of the viewer so the FIT/-/+/expand controls never sit on top of the sheet (table/notes); fit() treats this as outside the usable image area, and clamp() uses the same ch, so panning can never slide content under the controls either. */
  const ptrs=new Map(); let pinch=null, lastTap=0, moved=0, downPt=null;
  function apply(){ const t=`translate(${tx}px,${ty}px) scale(${scale})`; img.style.transform=t; ov.style.transform=t;
    /* At fit scale there is nothing to pan (the whole image already fits), so let the browser
       scroll the page normally (pan-y) instead of trapping the gesture. Only once the user has
       actually zoomed in past fit do we take exclusive control (none) for pinch/pan. This is what
       was behind the "zoom and scroll down" complaint: the viewer used to swallow every touch at
       fit scale and do nothing with it. */
    el.style.touchAction = (el.classList.contains('full') || scale>minS*1.01) ? 'none' : 'pan-y'; }
  function clamp(){ const maxS=Math.max(minS*10,8); scale=Math.max(minS,Math.min(scale,maxS));
    const w=iw*scale,h=ih*scale; tx=(w<=cw)?(cw-w)/2:Math.min(0,Math.max(cw-w,tx)); ty=(h<=ch)?(ch-h)/2:Math.min(0,Math.max(ch-h,ty)); }
  function fit(){ cw=el.clientWidth; ch=Math.max(el.clientHeight-CTRL_RESERVE,120); minS=Math.min(cw/iw,ch/ih); scale=minS; clamp(); apply(); }

/* ---------- routing ---------- */
function go(hash, anchor){ if(location.hash===hash){ render(); if(anchor) setTimeout(()=>{const a=document.getElementById(anchor); if(a) a.scrollIntoView({behavior:'smooth'});},50); } else { location.hash=hash; if(anchor) setTimeout(()=>{const a=document.getElementById(anchor); if(a) a.scrollIntoView({behavior:'smooth'});},120);} }
window.addEventListener('hashchange',()=>{ render(); window.scrollTo(0,0); });
function encId(id){ return String(id).replace(/\./g,'-'); }
function decId(s){ return String(s).replace(/-/g,'.'); }
function parseRoute(){ const h=(location.hash||'#start').slice(1); const parts=h.split('--'); const view=parts[0]||'home'; let arg=parts[1]||null; const qs={};
  if(view==='swall'){ qs.level=SWDATA.sw_levels.some(l=>l.id===parts[1])?parts[1]:DEFAULT_SW_LEVEL; arg=null; }
  else if(view==='swsec'||view==='swdet'){ qs.level=SWDATA.sw_levels.some(l=>l.id===parts[1])?parts[1]:DEFAULT_SW_LEVEL; arg=parts[2]||null; if(view==='swdet'&&arg) arg=decId(arg); if(parts[3]) qs.from=parts[3]; }
  else if(/^tr/.test(view)){ qs.p=parts.slice(1); arg=parts[1]||null; }
  else { if(view==='det'&&arg) arg=decId(arg); if(parts[2]) qs.from=parts[2]; }
  return {view, arg, qs}; }

  { const bb=document.getElementById('bottombar'); if(bb && nfMode()!=='tr' && bb.dataset.m==='tr'){ bb.innerHTML=BB_ORIG; bb.dataset.m=''; } }
  { const bb=document.getElementById('bottombar'); if(bb) bb.style.display=(nfMode()==='lv'||nfMode()==='tr')?'none':''; }
  if(/^tr/.test(r.view)){ renderTR(app, r); return; }

  else if(r.view==='conn') renderConnHome(app);

  else renderHome(app);
}

let FLBUSY={};
function flSecs(L){ return L&&L.tr ? TR.sections.filter(x=>trGroup(x)===L.tr && !trPend(x)) : []; }
function flUrls(L){ return [...new Set(flSecs(L).reduce((a,x)=>a.concat(x._urls),[]))]; }
async function flCount(urls){ if(!('caches' in window)) return -1; try{ const c=await caches.open(TR_CACHE); const set=new Set((await c.keys()).map(r=>r.url)); return urls.filter(u=>set.has(trAbs(u))).length; }catch(e){ return -1; } }
async function flPaint(n){ const box=document.getElementById('flsave'); if(!box) return; const L=NF_LEVELS.find(x=>x.n===n);
  try{ await trLoad(); }catch(e){ box.innerHTML='<h2>Offline</h2><div class="hint" style="margin:0">Open the app once with signal to load this.</div>'; return; }
  if(!document.getElementById('flsave')) return;
  const urls=flUrls(L), tot=urls.length, bytes=flSecs(L).reduce((a,x)=>a+(x.designs_bytes||0),0), nsec=flSecs(L).length;
  const done=await flCount(urls); if(!document.getElementById('flsave')) return;
  const shared=L.tr==='567'?' Levels 5–7 share the same pages.':'';
  let body;
  if(done<0) body='<div class="hint" style="margin:0">Saving on the phone is not available in this browser.</div>';
  else if(FLBUSY[L.tr]) body=`<div id="flprog" style="font-weight:800">Saving… ${FLBUSY[L.tr].done} of ${tot}</div>`;
  else if(done>=tot) body=`<div style="font-weight:800;color:var(--ok)">✔ Saved on this phone</div><div class="hint">All ${tot} pages work with no signal.${shared}</div><button class="btn sec" style="margin-top:8px" onclick="flRemove(${n})">Remove from phone</button>`;
  else body=`<button class="btn" onclick="flSave(${n})"><span>⬇ Save this floor offline · ${trFmt(bytes)}<br><small style="font-weight:600">${tot} pages${done>0?' · '+done+' already saved':''}</small></span></button><div class="hint">Do this once with Wi-Fi.${shared}</div>`;
  box.innerHTML=`<h2>Offline</h2><div class="hint" style="margin:0 0 8px 0">Layouts, connections and shear blocks are always on the phone.</div>`+body; }
async function flSave(n){ const L=NF_LEVELS.find(x=>x.n===n); const k=L.tr; if(FLBUSY[k]) return; FLBUSY[k]={done:0,fail:0};
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  const urls=flUrls(L); const c=await caches.open(TR_CACHE); const have=new Set((await c.keys()).map(r=>r.url)); const todo=urls.filter(u=>!have.has(trAbs(u))); FLBUSY[k].done=urls.length-todo.length; flPaint(n);
  let idx=0; const worker=async()=>{ while(idx<todo.length){ const u=todo[idx++]; try{ const r=await fetch(trAbs(u)); if(!r.ok) throw new Error('HTTP '+r.status); await c.put(trAbs(u),r); FLBUSY[k].done++; }catch(e){ FLBUSY[k].fail++; }
      const p=document.getElementById('flprog'); if(p) p.textContent='Saving… '+FLBUSY[k].done+' of '+urls.length; } };
  await Promise.all([worker(),worker(),worker(),worker()]); const f=FLBUSY[k].fail; delete FLBUSY[k]; await flPaint(n);

async function flRemove(n){ const L=NF_LEVELS.find(x=>x.n===n); const c=await caches.open(TR_CACHE); for(const u of flUrls(L)){ await c.delete(trAbs(u)); } await flPaint(n); }

<script>
// Offline install: cache the whole app (shell + every section/detail image) the first time
// it loads, so it keeps working with zero signal afterwards - this is what makes it safe to
// use on the jobsite. Works the same on iPhone and Android; no app store, no account.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').then((reg) => {
      // Actively check for a newer version every time the app is opened, instead of
      // waiting for the browser's own update schedule - on a phone added to the home
      // screen (no browser tab, no refresh button) that schedule can be very lazy and
      // the crew can be stuck on an old cached version for a long time without knowing.
      reg.update().catch(() => {});
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
