name: Unpack site zip parts

on:
  push:
    paths:
      - 'site_part1.zip'
      - 'site_part2.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip whichever parts are present
        run: |
          for f in site_part1.zip site_part2.zip; do
            if [ -f "$f" ]; then
              unzip -o "$f" -d .
              rm -f "$f"
            fi
          done
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unpack site zip part"
          git push
